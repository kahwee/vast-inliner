name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release metadata guard
        run: node --test scripts/check-release-guard.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      # Preserve every check; package validation depends on the completed build.
      - parallel:
          - name: Formatting
            run: bun run format:check
          - name: Type check
            run: bun run typecheck
          - name: Tests with coverage
            run: bun run test
          - name: Audit
            run: bun audit
      - name: Build and verify package
        run: bun run build && bun run package:check
