name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Preserve every check; package validation depends on the completed build.
      - parallel:
          - name: Formatting and lint
            run: bun run format:check && bun run lint
          - name: Type check
            run: bun run typecheck
          - name: Tests with coverage
            run: bun run test
          - name: Audit
            run: bun audit
      - name: Build and verify package
        run: bun run build && bun run package:check
